---
name: build

"on":
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Verify vendored CMSIS
        run: |
          sed -nE 's/^    ([[:xdigit:]]{64}  CMSIS\/.*)$/\1/p' \
            CMSIS/PROVENANCE.md > /tmp/cmsis.sha256
          test "$(wc -l < /tmp/cmsis.sha256)" -eq 13
          sha256sum --check /tmp/cmsis.sha256

      - name: Install Arm toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi binutils-arm-none-eabi \
            libnewlib-arm-none-eabi

      - name: Build firmware
        run: make

      - name: Verify firmware layout
        run: python3 tools/verify_firmware.py build/FieldKitFX.elf

      - name: Check artifacts
        run: |
          test -f build/FieldKitFX.elf
          test -f build/FieldKitFX.bin
          test -f build/FieldKitFX.hex

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: FieldKitFX-firmware
          path: |
            build/FieldKitFX.elf
            build/FieldKitFX.bin
            build/FieldKitFX.hex
